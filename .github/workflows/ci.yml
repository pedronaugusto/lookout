name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      status-only:
        description: Verify the recorded merge or release tier for this exact commit
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push' && !inputs.status-only
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@e3d81b9e477c1c690f1ce03506511935d16035c3
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: e3d81b9e477c1c690f1ce03506511935d16035c3
      working-directory: "."
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || inputs.status-only || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@e3d81b9e477c1c690f1ce03506511935d16035c3
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      working-directory: "."
      preflight-ref: e3d81b9e477c1c690f1ce03506511935d16035c3
      attest: ${{ github.event_name == 'push' || inputs.status-only }}
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=debug","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":"","operation":"execute"}]}
      merge-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=debug -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":"","operation":"execute"},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"8c46ddba71b8f318","artifact":"","operation":"execute"},{"os":"windows-latest","name":"SDK link (x86_64-windows-gnu)","step":"ci-link","args":"-Dci-lint=false -Dtarget=x86_64-windows-gnu","shard":"","setup":true,"job_timeout":20,"cache_key":"8d92da446aa075a6","artifact":"","operation":"link"},{"os":"windows-latest","name":"SDK link (x86_64-windows-msvc)","step":"ci-link","args":"-Dci-lint=false -Dtarget=x86_64-windows-msvc","shard":"","setup":true,"job_timeout":20,"cache_key":"4ac231051585b1f0","artifact":"","operation":"link"},{"os":"windows-latest","name":"SDK link (aarch64-windows-gnu)","step":"ci-link","args":"-Dci-lint=false -Dtarget=aarch64-windows-gnu","shard":"","setup":true,"job_timeout":20,"cache_key":"d354ee1af8560233","artifact":"","operation":"link"}]}
      merge-compile-matrix: >-
        {"include":[{"os":"windows-latest","name":"native link for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu -Dcpu=baseline","shard":"","setup":true,"job_timeout":20,"cache_key":"compile-8c10bd50445b6b62","artifact":"preflight-8c10bd50445b6b62","operation":"link"}]}
      merge-run-matrix: >-
        {"include":[{"os":"windows-latest","name":"test (windows-latest, Debug)","step":"ci-run","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"8c10bd50445b6b62","artifact":"preflight-8c10bd50445b6b62","operation":"replay"}]}
