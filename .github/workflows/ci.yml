name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tier:
        description: fast, merge (the candidate for main) or release (before a cut, or after threading or platform work)
        type: choice
        options: [fast, merge, release]
        default: fast
      adopt:
        description: Initialize absent source ledgers from findings already on main
        type: boolean
        default: false
  pull_request:
  merge_group:
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  skip:
    if: github.event_name != 'push'
    uses: pedronaugusto/preflight/.github/workflows/skip.yml@260ed79cf626e7ab8fb05039db476bb680b4a653
    with:
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      preflight-ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
  gate:
    needs: skip
    if: always() && (github.event_name == 'push' || (needs.skip.result == 'success' && needs.skip.outputs.docs-only != 'true'))
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@260ed79cf626e7ab8fb05039db476bb680b4a653
    with:
      preflight-ref: 260ed79cf626e7ab8fb05039db476bb680b4a653
      tier: ${{ github.event_name == 'workflow_dispatch' && inputs.tier || 'merge' }}
      adopt: ${{ github.event_name == 'workflow_dispatch' && inputs.adopt }}
      attest: ${{ github.event_name == 'push' }}
      # Generated from ci/workflow.json with zig build plan -- --tier fast.
      fast-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""}]}
      # Generated with zig build plan -- --tier merge.
      merge-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"Linux Debug","step":"preflight-fast","args":"-Doptimize=Debug -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"fast-linux-debug-0","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"6313ab52f19777ed","artifact":""}]}
      merge-compile-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"compile for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"}]}
      merge-run-matrix: >-
        {"include":[{"os":"windows-latest","name":"test (windows-latest, Debug)","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"}]}
      # Generated with zig build plan -- --tier release.
      release-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"4ef6f71394fc7b54","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"b1ef680b3cf751fc","artifact":""},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=ReleaseFast -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"78112c0bbd06b163","artifact":""},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"6313ab52f19777ed","artifact":""},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"fc2cf325f2f2b45f","artifact":""},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"f8fb09ced14d6cbf","artifact":""},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"install","args":"-Doptimize=ReleaseSmall","shard":"","setup":false,"job_timeout":20,"cache_key":"f412a17af71b11a5","artifact":""},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"31829ac6da603806","artifact":""},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=Debug -Dci-lint=false","shard":"","setup":true,"job_timeout":20,"cache_key":"20e55f2196cc8a5e","artifact":""}]}
      release-compile-matrix: >-
        {"include":[{"os":"ubuntu-latest","name":"compile for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"},{"os":"ubuntu-latest","name":"compile for test (windows-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu","shard":"","setup":false,"job_timeout":20,"cache_key":"compile-1e57a6a5744ac376","artifact":"preflight-1e57a6a5744ac376"}]}
      release-run-matrix: >-
        {"include":[{"os":"windows-latest","name":"test (windows-latest, Debug)","step":"ci-run","args":"-Doptimize=Debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"68bbf534cd2c09ea","artifact":"preflight-68bbf534cd2c09ea"},{"os":"windows-latest","name":"test (windows-latest, ReleaseSafe)","step":"ci-run","args":"-Doptimize=ReleaseSafe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"1e57a6a5744ac376","artifact":"preflight-1e57a6a5744ac376"}]}
      compile-once: true
