name: CI
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full merge gate
        type: boolean
        default: false
  pull_request:
  merge_group:
  schedule:
    - cron: '17 4 * * 1'
concurrency:
  # Main status runs must not share the replaceable branch queue.
  group: ci-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && format('main-status-{0}', github.run_id) || github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
  actions: read
jobs:
  gate:
    uses: pedronaugusto/preflight/.github/workflows/zig.yml@25a0b56ab1802b3479105a5b477b8fb3b6658869
    with:
      preflight-ref: 25a0b56ab1802b3479105a5b477b8fb3b6658869
      full: ${{ github.event_name != 'workflow_dispatch' || inputs.full }}
      attest: ${{ github.event_name == 'push' }}
