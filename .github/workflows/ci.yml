        {"include":[{"os":"ubuntu-latest","name":"test (ubuntu-latest, Debug)","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"748e1c9aadb519d6","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"8bb01bb0e45c7c01","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"test (ubuntu-latest, ReleaseFast)","step":"ci","args":"-Doptimize=fast -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"29fdd164d5423dcb","artifact":"","operation":"execute"},{"os":"macos-latest","name":"test (macos-latest, Debug)","step":"ci","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"8c46ddba71b8f318","artifact":"","operation":"execute"},{"os":"macos-latest","name":"test (macos-latest, ReleaseSafe)","step":"ci","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true","shard":"","setup":true,"job_timeout":20,"cache_key":"09a00ce0bc391ea0","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"source checks and documented snippets","step":"lint","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"1d002af3d9d6fe43","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"compile (ReleaseSmall)","step":"install","args":"-Doptimize=small","shard":"","setup":false,"job_timeout":20,"cache_key":"a6573731da3d2e93","artifact":"","operation":"execute"},{"os":"ubuntu-latest","name":"cross (all configured targets)","step":"preflight-cross","args":"","shard":"","setup":false,"job_timeout":20,"cache_key":"1be51a0c0c45e756","artifact":"","operation":"objects"},{"os":"ubuntu-latest","name":"ThreadSanitizer (Linux)","step":"test","args":"-Dthread-sanitizer -Doptimize=debug -Dci-lint=false","shard":"","setup":true,"job_timeout":20,"cache_key":"62858ba313b70d1d","artifact":"","operation":"execute"},{"os":"windows-latest","name":"SDK link (x86_64-windows-gnu)","step":"ci-link","args":"-Dci-lint=false -Dtarget=x86_64-windows-gnu","shard":"","setup":true,"job_timeout":20,"cache_key":"8d92da446aa075a6","artifact":"","operation":"link"},{"os":"windows-latest","name":"SDK link (x86_64-windows-msvc)","step":"ci-link","args":"-Dci-lint=false -Dtarget=x86_64-windows-msvc","shard":"","setup":true,"job_timeout":20,"cache_key":"4ac231051585b1f0","artifact":"","operation":"link"},{"os":"windows-latest","name":"SDK link (aarch64-windows-gnu)","step":"ci-link","args":"-Dci-lint=false -Dtarget=aarch64-windows-gnu","shard":"","setup":true,"job_timeout":20,"cache_key":"d354ee1af8560233","artifact":"","operation":"link"}]}
      release-compile-matrix: >-
        {"include":[{"os":"windows-latest","name":"native link for test (windows-latest, Debug)","step":"ci-build","args":"-Doptimize=debug -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu -Dcpu=baseline","shard":"","setup":true,"job_timeout":20,"cache_key":"compile-8c10bd50445b6b62","artifact":"preflight-8c10bd50445b6b62","operation":"link"},{"os":"windows-latest","name":"native link for test (windows-latest, ReleaseSafe)","step":"ci-build","args":"-Doptimize=safe -Dci-lint=false -Dci-timings=true -Dtarget=x86_64-windows-gnu -Dcpu=baseline","shard":"","setup":true,"job_timeout":20,"cache_key":"compile-c0f8f844e3a1bd3d","artifact":"preflight-c0f8f844e3a1bd3d","operation":"link"}]}
      release-run-matrix: >-
